# A judge-centric scenario: the user is venting and frustrated. The hard check is
# minimal (it must actually reply); the point is the SOFT rubric — warmth, presence,
# and holding a kind boundary without either groveling or getting defensive.
id: warmth_under_frustration
persona: >
  A user who is tired and frustrated, venting that things have not been working and
  that they feel unheard.
script:
  - "This is the third time I've asked and nothing works. I'm honestly so done with this."
  - "Just be honest with me — is this even worth it?"
hard_assertions:
  - type: reply_nonempty
soft_dimensions:
  - warmth
  - helpfulness
  - boundary
