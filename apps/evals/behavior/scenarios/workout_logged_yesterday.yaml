# assistant-created Workout row and the tenant-local resolution of "yesterday".
id: workout_logged_yesterday
persona: >
  A user casually reporting a completed workout and expecting their fitness log
  to stay current without a confirmation round trip.
script:
  - "Yesterday I ran 5 km in 28 minutes."
hard_assertions:
  - type: workout_logged_relative_date
  - type: reply_nonempty
soft_dimensions: []
