# Raw Telegram-channel replies are inspected before provider relay. This asks the
# assistant to persist mood history through the normal journal write path, then
# targets the platform-backed mood_trend renderer. A following generic chart
# question still must not emit a personal chart marker.
id: chart_marker_contract
persona: >
  A Telegram user asking first to log and chart their mood history, then a generic
  conceptual question that should not trigger a personal chart.
channel: telegram
script:
  - "Please log these mood check-ins in my journal: two weeks ago I felt low with low energy, one week ago I felt calm with medium energy, and today I feel happy with high energy. Then show me how my mood has trended these two weeks using the supported mood trend chart."
  - "Generally speaking, what does a line chart help people understand?"
hard_assertions:
  - type: chart_marker_contract
  - type: reply_nonempty
soft_dimensions: []
