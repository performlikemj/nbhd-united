name: CI / CD

on:
  # Push to main → run full pipeline including deploys (deploys are
  # already gated on ``ref == refs/heads/main`` further down). Push to
  # feature branches DOES NOT need to trigger this workflow — the
  # ``pull_request`` event below covers PR'd branches, and pre-PR
  # pushes don't gate anything. Without this scope every force-push to
  # a PR'd branch fires CI twice (once per event), doubling compute
  # and slowing both runs by competing for runners.
  push:
    branches: ['main']
  pull_request:
    branches: ['**']
  workflow_dispatch:
    # One-shot fleet rollout knobs. Default false on every dispatch — these
    # ops are intended to run once after PR #434 ships and then never again.
    # See `apps/orchestrator/management/commands/bump_all_tenant_images.py`
    # and `apps/orchestrator/management/commands/refresh_persona_agents_md.py`
    # for details on what each flag does.
    inputs:
      rollout_byo_image_bump:
        description: 'One-shot: bump every active tenant to current OpenClaw image'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      rollout_byo_persona_refresh:
        description: 'One-shot: re-render workspace/AGENTS.md to every active tenant'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

defaults:
  run:
    shell: bash

env:
  REGISTRY: nbhdunited
  RESOURCE_GROUP: rg-nbhd-prod
  DJANGO_APP: nbhd-django-westus2
  SWA_NAME: nbhd-united-frontend
  PII_DETECTOR_ENGINE: deberta

# Serialize the pipeline so concurrent merges can never race the production
# deploy. The app runs in single-revision mode (Telegram poller 409 avoidance),
# so `az containerapp update` is last-writer-wins — decoupled from commit order.
# On 2026-07-09 three PRs merged seconds apart, the OLDEST run's deploy finished
# last, and prod served code missing two of the three features while every run
# showed green. See docs/deploy-concurrency-directive.md.
#
#   - On main (cancel-in-progress: false): a running deploy is never killed
#     mid-flight (a half-deploy is worse than a stale one). New runs queue;
#     GitHub keeps at most one pending run per group, so a third push supersedes
#     the older PENDING run and the newest waits. Final state converges to the
#     newest code. Superseded runs show "cancelled" — expected, not a failure.
#   - On PR branches (cancel-in-progress: true): a re-push cancels the obsolete
#     run to save CI minutes. github.ref is refs/pull/<n>/merge, so each PR gets
#     its own group and PRs never queue behind each other or behind main.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ==========================================================================
  # Frontend: lint and build
  # ==========================================================================
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend (static export)
        working-directory: frontend
        run: npm run build

  # ==========================================================================
  # Backend: Django checks and tests
  # ==========================================================================
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pin Ruff so formatter output matches the version used to format this repo; an
          # unpinned release broke main with zero code changes on 2026-07-25. Bump the pin
          # and reformat the repo together in the same deliberate-chore PR.
          pip install "ruff==0.15.21"
          python -m spacy download en_core_web_sm

      - name: Run ruff lint
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Secret scan
        run: |
          HITS=$(grep -rPn '(sk-ant-[A-Za-z0-9_-]{20,}|sk-or-v1-[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|AAAAAAAAAAAAA|tvly-dev-[A-Za-z0-9_-]{20,})' \
            --include='*.py' --include='*.ts' --include='*.tsx' --include='*.js' \
            --include='*.json' --include='*.yaml' --include='*.yml' \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.venv \
            --exclude='*.lock' \
            --exclude='config_validator.py' \
            --exclude='config_security.py' \
            --exclude='test_config_security.py' \
            --exclude='harness-check' \
            --exclude='ci-cd.yml' \
            . 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "Secret patterns detected in source files:"
            echo "$HITS"
            exit 1
          fi
          echo "No secret patterns found"

      - name: Run Django checks and tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: test-secret-key-not-for-production
          DEBUG: "True"
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
          ALLOWED_HOSTS: "*"
          # Force on_commit callbacks to run synchronously in tests so
          # daemon-thread USER.md pushes (envelope registry) and QStash
          # publishes (journal post_save) don't outlive the test runner
          # and hold DB connections open during teardown.
          NBHD_DISABLE_BACKGROUND_THREADS: "True"
          # Tests trigger model post_save → registry → push_user_md, which
          # would otherwise call real Azure storage. Mock keeps tests fast
          # (otherwise each save burns ~30s on DefaultAzureCredential
          # timeouts).
          AZURE_MOCK: "true"
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py check
          python manage.py test apps/

      - name: Config validator check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: test-secret-key-not-for-production
          DEBUG: "True"
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
          ALLOWED_HOSTS: "*"
          AZURE_MOCK: "true"
          OPENCLAW_USAGE_PLUGIN_ID: ""
        run: |
          python manage.py shell -c "
          from apps.tenants.services import create_tenant
          from apps.orchestrator.config_generator import generate_openclaw_config
          from apps.orchestrator.config_validator import validate_openclaw_config
          from apps.orchestrator.config_security import audit_config_security

          tenant = create_tenant(display_name='CI Validator', telegram_chat_id=999999)
          config = generate_openclaw_config(tenant)

          issues = validate_openclaw_config(config)
          errors = [i for i in issues if i.severity == 'error']
          if errors:
              for e in errors:
                  print(f'ERROR: {e.path} — {e.message}')
              raise SystemExit(1)

          findings = audit_config_security(config)
          sec_errors = [f for f in findings if f.severity == 'error']
          if sec_errors:
              for f in sec_errors:
                  print(f'SECURITY: {f.check} — {f.message}')
              raise SystemExit(1)

          print('Config validator: PASS')
          print('Security audit: PASS')
          "

  # ==========================================================================
  # OpenClaw config conformance smoke
  # ==========================================================================
  openclaw-config-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: smoke_db
          POSTGRES_USER: smoke_user
          POSTGRES_PASSWORD: smoke_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: OpenClaw plugin packaging guard
        # Static, no-DB: every plugin the config generator can put in
        # plugins.load.paths must be COPY'd into Dockerfile.openclaw. Catches
        # the 2026-07-05 boot-crash class ("plugin path not found") at PR time —
        # e.g. nbhd-friends-tools emitted on friends_enabled but never packaged.
        run: |
          python scripts/check_openclaw_plugin_packaging.py

      - name: Encrypted-column predicate guard
        # Static, no-DB: blocks new raw DB value-predicates (icontains, gt,
        # bare equality, ...) against columns registered for Phase 2-4
        # encryption-at-rest (CONTINUITY_encryption-phase1.md §1 PR6). A
        # predicate like this against an already-encrypted column doesn't
        # error — it silently stops matching real content. Pre-existing
        # sites are allowlisted in-script; this only fires on a NEW raw
        # predicate a future PR adds.
        run: |
          python scripts/check_encrypted_column_predicates.py

      - name: RedactedStr raw-buffer egress guard
        # Static, no-DB: blocks a decrypted `RedactedStr` (apps.crypto.nolog)
        # from slipping through a RAW-buffer consumer — json.dumps/.encode/
        # concat/"".join/slice/str-method/.write — which all reach past the
        # redacting format dunders and emit the real plaintext. The seam is
        # closed by calling `.reveal()` at a deliberate egress; this guard
        # narrows it so a value that should have been revealed can't leak
        # through a raw buffer instead. Phase-2 precondition
        # (docs/encryption-at-rest-phase1-status.md, item 3). Escape hatch:
        # `# noqa: redactedstr-egress — seam: <name>` on the flagged line.
        run: |
          python scripts/check_redactedstr_egress.py

      - name: Run OpenClaw doctor smoke
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: test-secret-key-not-for-production
          DEBUG: "True"
          DATABASE_URL: postgres://smoke_user:smoke_password@localhost:5432/smoke_db
          ALLOWED_HOSTS: "*"
          MOONSHOT_API_KEY: "sk-smoke-test-dummy"
          NBHD_INTERNAL_API_KEY: "smoke-test-internal-key"
        run: |
          ./scripts/openclaw_config_doctor_smoke.sh

      - name: Generate maximal-flags OpenClaw config (friends + all experimental)
        # Widest config surface: friends plugin path + every version-gated
        # agents.defaults branch. Strict-validate the Django-owned blocks now,
        # then hand the file to the freshly BUILT image in deploy-backend so
        # `openclaw doctor` checks it against the real /opt/nbhd/plugins/ tree.
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: test-secret-key-not-for-production
          DEBUG: "True"
          DATABASE_URL: postgres://smoke_user:smoke_password@localhost:5432/smoke_db
          ALLOWED_HOSTS: "*"
          MOONSHOT_API_KEY: "sk-smoke-test-dummy"
          NBHD_INTERNAL_API_KEY: "smoke-test-internal-key"
        run: |
          python manage.py migrate --noinput
          python manage.py generate_smoke_config --maximal --output openclaw-maximal.json
          python - <<'PY'
          import json, sys
          from apps.orchestrator.config_validator import validate_openclaw_config
          config = json.load(open("openclaw-maximal.json"))
          errors = [i for i in validate_openclaw_config(config, strict=True) if i.severity == "error"]
          if errors:
              print("maximal-flags config FAILED strict validation:")
              for e in errors:
                  print(f"  {e.path}: {e.message}")
              sys.exit(1)
          print("maximal-flags config passed strict validation")
          PY

      - name: Upload maximal-flags config for the built-image boot smoke
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-maximal-config
          path: openclaw-maximal.json
          retention-days: 1

      - name: Run redact-stdout.js sidecar tests
        # NBHD_REDACT_STDOUT_DISABLE_AUTOINSTALL=1 prevents the sidecar
        # from patching the test runner's own streams (which would
        # redact node:test's TAP output). The end-to-end subtests spawn
        # child processes with the env var cleared so the wrap installs
        # correctly there.
        env:
          NBHD_REDACT_STDOUT_DISABLE_AUTOINSTALL: "1"
        run: |
          node --test runtime/openclaw/redact-stdout.test.mjs
          node --test runtime/openclaw/plugins/nbhd-routing-context/test.js
          node --test runtime/openclaw/plugins/nbhd-cron-enforcement/test.js
          node --test runtime/openclaw/plugins/error-transport.test.js

      - name: Run suppress-chmod-eperm.js Layer 1 tests
        run: |
          node --test runtime/openclaw/suppress-chmod-eperm.test.mjs

      - name: Run nbhd toolcall + hook-registration tests
        # Same autoinstall guard as the redact step so the sidecar doesn't
        # patch node:test's streams (tool-logger.test.js captures console.log).
        env:
          NBHD_REDACT_STDOUT_DISABLE_AUTOINSTALL: "1"
        run: |
          node --test runtime/openclaw/tool-logger.test.js
          node --test runtime/openclaw/plugins/nbhd-journal-tools/schema.test.mjs
          node --test runtime/openclaw/plugins/nbhd-settings-tools/schema.test.mjs
          node --test runtime/openclaw/plugins/nbhd-google-tools/
          node --test runtime/openclaw/plugins/nbhd-usage-reporter/register.test.mjs
          node --test runtime/openclaw/plugins/nbhd-friends-tools/index.test.mjs
          node --test runtime/openclaw/external-content-wrap.test.js
          node --test runtime/openclaw/plugins/nbhd-doc-taint-guard/test.js
          node --test runtime/openclaw/evals/upload_security_corpus.test.js

      - name: Run pinned OpenClaw origin-propagation smoke
        # Exercises the authenticated HTTP handler, actual pinned agent runtime,
        # real loaded datebook plugin factory, and captured Django-runtime POST.
        run: |
          ./scripts/openclaw_origin_propagation_smoke.sh

      - name: Audit OpenClaw chmod call-site inventory
        # Diffs the chmod-family callee shapes in the pinned OpenClaw npm
        # package against runtime/openclaw/chmod-audit-baseline.txt. Fails
        # if OC introduces a new variant that suppress-chmod-eperm.js
        # Layer 1 may not cover. Context: PR #504 / 2026-05-10 incident.
        run: |
          ./scripts/openclaw_chmod_audit.sh

  # ==========================================================================
  # Deploy Backend (push to main only, after tests pass)
  # ==========================================================================
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test, openclaw-config-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      # Optional: add a SENTRY_AUTH_TOKEN repo secret to enable Sentry release
      # tracking + suspect-commit detection. When unset, the release step below
      # is skipped and the deploy is unaffected — events still group by the
      # SENTRY_RELEASE (git SHA) set on the container app.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: by-way-of-mj
      SENTRY_PROJECT: python-django
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so Sentry can attribute suspect commits

      # Belt-and-suspenders backstop to the concurrency block: skip (green) if
      # this commit is no longer the tip of main. Point-in-time only — it closes
      # the "an old run was re-run by hand / concurrency was removed" hole, not
      # the TOCTOU window during the ~2.5GB image build (that's what the
      # concurrency block covers). `git fetch origin main` always writes
      # FETCH_HEAD regardless of the checkout's refspec, so rev-parse never
      # depends on refs/remotes/origin/main existing.
      - name: Skip if superseded by a newer main commit
        id: freshness
        run: |
          git fetch origin main --quiet
          TIP=$(git rev-parse FETCH_HEAD)
          if [ "$TIP" != "${{ github.sha }}" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping backend deploy: origin/main is now $TIP, this run is ${{ github.sha }} (superseded). The newer run will deploy — this run ends green."
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
            echo "This run (${{ github.sha }}) is the tip of main — proceeding with deploy."
          fi

      - name: Azure Login
        if: steps.freshness.outputs.superseded != 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        if: steps.freshness.outputs.superseded != 'true'
        run: az acr login --name ${{ env.REGISTRY }}

      # This content tag names the pinned DeBERTa revision and the default
      # DeBERTa-only recipe shape. The old v2 alias was briefly overwritten by
      # the dual-model lane, so it is not a safe rollback target. Bump this tag
      # and the COPY line in Dockerfile together when the pinned content changes.
      - name: Ensure pinned DeBERTa-only PII model image
        if: steps.freshness.outputs.superseded != 'true'
        run: |
          # Keep this consumer tag matched to the Django Dockerfile (two-place rule).
          PII_MODEL_TAG=deberta-only-a038061af92047b0
          if ! az acr repository show \
              --name ${{ env.REGISTRY }} \
              --image pii-model:${PII_MODEL_TAG} >/dev/null 2>&1; then
            echo "pii-model:${PII_MODEL_TAG} missing — building the pinned DeBERTa-only artifact"
            docker build --platform linux/amd64 \
              --build-arg INCLUDE_LIQUID=false \
              -f Dockerfile.pii-model \
              -t ${{ env.REGISTRY }}.azurecr.io/pii-model:${PII_MODEL_TAG} \
              .
            docker push ${{ env.REGISTRY }}.azurecr.io/pii-model:${PII_MODEL_TAG}
          fi
          echo "Pinned DeBERTa-only pii-model:${PII_MODEL_TAG} is available in ACR."

      - name: Build and push Django image
        if: steps.freshness.outputs.superseded != 'true'
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.REGISTRY }}.azurecr.io/django:${{ github.sha }} \
            -t ${{ env.REGISTRY }}.azurecr.io/django:latest \
            .
          docker push ${{ env.REGISTRY }}.azurecr.io/django:${{ github.sha }}
          docker push ${{ env.REGISTRY }}.azurecr.io/django:latest

      - name: Smoke-test PII stack in Django image
        if: steps.freshness.outputs.superseded != 'true'
        run: |
          # Guards three regressions that have shipped before: (1) torch
          # reinstalled as the CUDA wheel; (2) a weightless model layer; (3) the
          # shelved Liquid bundle leaking back into the serving Django image.
          docker run --rm --entrypoint python \
            ${{ env.REGISTRY }}.azurecr.io/django:${{ github.sha }} \
            -c "import os, torch; assert '+cpu' in torch.__version__, f'torch is not the CPU build: {torch.__version__}'; from transformers import AutoModelForTokenClassification; files = os.listdir('/app/pii-model'); assert any(f.endswith(('.bin', '.safetensors')) for f in files), f'no model weights in /app/pii-model: {files}'; assert not os.path.exists('/app/pii-model/liquid'), 'shelved Liquid bundle present in serving image'; print('PII smoke OK:', torch.__version__, '| weights:', [f for f in files if f.endswith(('.bin', '.safetensors'))])"

          # Golden-set regression guard: run the REAL detect+filter chain over
          # apps/pii/golden_set.json against the model baked into the image.
          # Every control span must redact and every clean phrase must stay
          # untouched — catches a detection/guard regression before deploy.
          docker run --rm --entrypoint python \
            -e DJANGO_SETTINGS_MODULE=config.settings.development \
            -e SECRET_KEY=ci-golden-check \
            -e DEBUG=False \
            -e ALLOWED_HOSTS='*' \
            -e DATABASE_URL=postgres://u:p@localhost:5432/db \
            ${{ env.REGISTRY }}.azurecr.io/django:${{ github.sha }} \
            -m apps.pii.golden_check

      - name: Build and push OpenClaw runtime image
        if: steps.freshness.outputs.superseded != 'true'
        run: |
          # Immutable, human-readable tag: <oc-version>-<short-sha>, where the
          # version is the OpenClaw binary baked into the image (Dockerfile.openclaw
          # ARG OPENCLAW_VERSION). Deliberately NO :latest — a moving tag can pull
          # an unvalidated build into a tenant on the next restart/wake. Each build
          # is frozen; tenants are bumped onto a specific, canary-validated tag.
          OC_VERSION=$(grep -oP 'ARG OPENCLAW_VERSION=\K[0-9.]+' Dockerfile.openclaw)
          OC_TAG="${OC_VERSION}-${GITHUB_SHA::7}"
          echo "OC_IMAGE_TAG=${OC_TAG}" >> "$GITHUB_ENV"
          echo "Building nbhd-openclaw:${OC_TAG}"
          docker build --platform linux/amd64 \
            -f Dockerfile.openclaw \
            -t ${{ env.REGISTRY }}.azurecr.io/nbhd-openclaw:${OC_TAG} \
            .
          docker push ${{ env.REGISTRY }}.azurecr.io/nbhd-openclaw:${OC_TAG}

      - name: Download maximal-flags config for boot smoke
        if: steps.freshness.outputs.superseded != 'true'
        uses: actions/download-artifact@v4
        with:
          name: openclaw-maximal-config

      - name: OpenClaw image boot smoke (maximal-flags config)
        if: steps.freshness.outputs.superseded != 'true'
        # The general net for the whole config/plugin class: validate the
        # maximal-flags config (friends_enabled=true + every experimental gate)
        # against the FRESHLY BUILT image's own binary and real /opt/nbhd/plugins/
        # tree. A plugin the config references but the image lacks surfaces here
        # as "plugin path not found" (the 2026-07-05 boot crash); a schema-invalid
        # agents.defaults surfaces as "Invalid config". Either fails the deploy
        # BEFORE any tenant is rolled onto the image.
        run: |
          OC_IMAGE=${{ env.REGISTRY }}.azurecr.io/nbhd-openclaw:${{ env.OC_IMAGE_TAG }}
          # Parity with the doctor-smoke env: the maximal config embeds
          # "${NBHD_INTERNAL_API_KEY}" in gateway.auth.token, so an unresolved
          # placeholder would false-fail doctor on an otherwise-valid config.
          docker run --rm \
            -v "$PWD/openclaw-maximal.json:/home/node/.openclaw/openclaw.json:ro" \
            -e OPENCLAW_CONFIG_PATH=/home/node/.openclaw/openclaw.json \
            -e OPENCLAW_STATE_DIR=/tmp/oc-smoke-state \
            -e NBHD_INTERNAL_API_KEY=smoke-test-internal-key \
            -e MOONSHOT_API_KEY=sk-smoke-test-dummy \
            --entrypoint openclaw \
            "$OC_IMAGE" doctor --non-interactive 2>&1 | tee /tmp/oc-boot-smoke.log
          if grep -qiE "Invalid config|plugin path not found" /tmp/oc-boot-smoke.log; then
            echo "::error::OpenClaw image boot smoke FAILED — the built image cannot validate a maximal-flags (friends_enabled) config. See the log above (plugin path not found / Invalid config)." >&2
            exit 1
          fi
          echo "OpenClaw image boot smoke passed — maximal-flags config validates against the built image."

      - name: Deploy Django to Container Apps
        if: steps.freshness.outputs.superseded != 'true'
        run: |
          # Ensure single-revision mode (only one active revision at a time).
          # Prevents multiple Telegram pollers competing for getUpdates (409 Conflict).
          az containerapp revision set-mode \
            --name ${{ env.DJANGO_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --mode single

          # Export without --show-secrets, then preserve the live definition
          # while atomically changing the image/env and readiness probe. A TCP
          # probe goes green when the Gunicorn master binds; HTTP /health/
          # cannot answer until a worker's synchronous post_worker_init has
          # resolved the PII model load (success or cached failure).
          DEPLOY_SPEC="$(mktemp)"
          trap 'rm -f "$DEPLOY_SPEC"' EXIT
          az containerapp show \
            --name ${{ env.DJANGO_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --output json > "$DEPLOY_SPEC"
          python3 -m config.containerapp_deploy \
            --spec "$DEPLOY_SPEC" \
            --container-name ${{ env.DJANGO_APP }} \
            --image ${{ env.REGISTRY }}.azurecr.io/django:${{ github.sha }} \
            --openclaw-image-tag ${{ env.OC_IMAGE_TAG }} \
            --sentry-release ${{ github.sha }} \
            --django-base-url https://nbhd-django-westus2.victoriousocean-5cdd2683.westus2.azurecontainerapps.io \
            --pii-detector-engine ${{ env.PII_DETECTOR_ENGINE }}
          az containerapp update \
            --name ${{ env.DJANGO_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --yaml "$DEPLOY_SPEC"

      - name: Wait for Django to serve THIS build (identity + liveness)
        if: steps.freshness.outputs.superseded != 'true'
        run: |
          # A blind 200-poll is liveness only: the OLD revision answers 200
          # instantly, so post-deploy steps could fire against stale code
          # during the cutover window (2026-07-09: register-system-crons hit
          # the old revision 18s after `az containerapp update` returned and
          # silently kept a retired cron alive). The deploy step stamps
          # SENTRY_RELEASE=<sha> onto the app env and /health/ echoes it as
          # "build" (config/health.py); succeed ONLY once the SERVING build
          # equals this run's SHA. The az template assertion below is the
          # complementary check — it proves nothing overwrote the template,
          # while this proves the cutover actually completed. Bootstrap: a
          # pre-build-field revision returns no "build" key -> not-ready ->
          # keep polling; the first deploy of this change self-resolves.
          DJANGO_URL="https://nbhd-django-westus2.victoriousocean-5cdd2683.westus2.azurecontainerapps.io"
          EXPECTED="${{ github.sha }}"
          echo "Waiting for the serving revision to report build=$EXPECTED ..."
          SERVED=""
          for i in $(seq 1 45); do
            BODY=$(curl -sf "$DJANGO_URL/health/" 2>/dev/null || echo "")
            SERVED=$(printf '%s' "$BODY" | jq -r '.build // ""' 2>/dev/null || echo "")
            if [ "$SERVED" = "$EXPECTED" ]; then
              echo "Serving build matches this run (attempt $i)."
              exit 0
            fi
            echo "Attempt $i: serving build='${SERVED:-<none>}', want $EXPECTED — retrying in 10s..."
            sleep 10
          done
          echo "::error::Cutover never completed: /health/ still reports build='${SERVED:-<none>}' but this run deployed $EXPECTED. Post-deploy steps (bump configs, reseed + register crons, backfill welcomes) would run against STALE code — failing hard instead."
          exit 1

      - name: Assert serving image identity (deploy-race guard)
        if: steps.freshness.outputs.superseded != 'true'
        run: |
          # Liveness (the health check above) is NOT identity: old code is
          # perfectly healthy, which is exactly why the 2026-07-09 deploy race
          # was all-green. Assert the app is actually serving THIS run's image.
          # Single-revision mode ⇒ the latest revision takes 100% traffic, so
          # the app template's image IS the serving image. Compare against the
          # immutable full-sha tag, never :latest (which always looks current).
          EXPECTED="${{ env.REGISTRY }}.azurecr.io/django:${{ github.sha }}"
          SERVING=$(az containerapp show \
            --name ${{ env.DJANGO_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.template.containers[0].image" -o tsv)
          echo "Expected serving image: $EXPECTED"
          echo "Actual serving image:   $SERVING"
          if [ "$SERVING" != "$EXPECTED" ]; then
            echo "::error::Deploy-race detected — the app is serving '$SERVING' but this run built and deployed '$EXPECTED'. A concurrent or stale ci-cd run overwrote this deploy (single-revision mode is last-writer-wins). Production is NOT running this commit. Recovery: replay the deploy for origin/main's sha (docs/deploy-concurrency-directive.md §1), then re-confirm the serving image sha equals origin/main." >&2
            exit 1
          fi
          echo "Serving image identity confirmed: production is running ${{ github.sha }}."

      # Register this deploy as a Sentry release so errors map to a specific
      # build and Sentry can surface the suspect commit. Gated on the optional
      # SENTRY_AUTH_TOKEN secret and continue-on-error, so a release-tracking
      # hiccup never fails a production deploy.
      - name: Create Sentry release (suspect commits)
        if: ${{ env.SENTRY_AUTH_TOKEN != '' && steps.freshness.outputs.superseded != 'true' }}
        continue-on-error: true
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
          VERSION=${{ github.sha }}
          sentry-cli releases new "$VERSION"
          # Prefer the GitHub integration (author attribution); fall back to
          # local git history (needs fetch-depth: 0 above); never hard-fail.
          sentry-cli releases set-commits "$VERSION" --auto \
            || sentry-cli releases set-commits "$VERSION" --local \
            || true
          sentry-cli releases finalize "$VERSION"
          sentry-cli releases deploys "$VERSION" new -e production

      - name: Bump pending config version for all tenants
        if: steps.freshness.outputs.superseded != 'true'
        run: |
          # Mark all active tenants as needing a config update.
          # apply-pending-configs cron will push new workspace files
          # (including docs/) to each tenant's file share on their
          # next idle cycle.
          DJANGO_URL="https://nbhd-django-westus2.victoriousocean-5cdd2683.westus2.azurecontainerapps.io"
          curl -sf -X POST \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
            "$DJANGO_URL/api/cron/bump-all-pending-configs/" \
            || echo "Warning: bump-all-pending-configs failed (non-fatal)"

      - name: Reseed tenant cron jobs
        if: steps.freshness.outputs.superseded != 'true'
        run: |
          # Delete and recreate system cron jobs for all active tenants.
          # Non-fatal: tenant containers restart asynchronously after config
          # bump — the old OpenClaw image may still be running when this fires.
          # QStash retries will reseed once containers pick up the new image.
          DJANGO_URL="https://nbhd-django-westus2.victoriousocean-5cdd2683.westus2.azurecontainerapps.io"
          curl -sf -X POST \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
            "$DJANGO_URL/api/cron/force-reseed-crons/" \
            || echo "Warning: force-reseed-crons failed — containers may still be restarting"

      - name: Register system QStash cron schedules
        if: steps.freshness.outputs.superseded != 'true'
        run: |
          # Ensure apply-pending-configs and other system crons are
          # scheduled in QStash. Idempotent — skips existing schedules.
          DJANGO_URL="https://nbhd-django-westus2.victoriousocean-5cdd2683.westus2.azurecontainerapps.io"
          curl -sf -X POST \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"base_url\": \"$DJANGO_URL\"}" \
            "$DJANGO_URL/api/cron/register-system-crons/" \
            || echo "Warning: register-system-crons failed (non-fatal)"

      - name: Backfill Fuel/Gravity welcome crons
        if: steps.freshness.outputs.superseded != 'true'
        run: |
          # Schedule welcome crons for active tenants who enabled the
          # feature before the welcome mechanism shipped (or whose welcome
          # failed transiently on a prior deploy). The endpoint calls
          # _schedule_fuel_welcome / _schedule_finance_welcome which are
          # idempotent — they skip when a _<feature>:welcome cron is
          # already pending in the container. Re-running is safe.
          DJANGO_URL="https://nbhd-django-westus2.victoriousocean-5cdd2683.westus2.azurecontainerapps.io"
          curl -sf -X POST \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
            -H "Content-Type: application/json" \
            "$DJANGO_URL/api/cron/backfill-welcomes/" \
            || echo "Warning: backfill-welcomes failed (non-fatal — manual: python manage.py backfill_welcomes)"

      - name: Emit successful main CI evidence to Steward
        if: steps.freshness.outputs.superseded != 'true'
        continue-on-error: true
        env:
          STEWARD_INGEST_SECRET: ${{ secrets.STEWARD_INGEST_SECRET }}
        run: |
          STEWARD_URL="https://nbhd-django-westus2.victoriousocean-5cdd2683.westus2.azurecontainerapps.io"
          TIMESTAMP=$(date +%s)
          BODY=$(printf '{"source":"ci_run","subject":"nbhd-united-main-ci","fingerprint":"%s"}' "$GITHUB_SHA")
          SIGNATURE=$(python -c 'import hashlib,hmac,os,sys; print(hmac.new(os.environ["STEWARD_INGEST_SECRET"].encode(), f"{sys.argv[1]}.".encode() + sys.argv[2].encode(), hashlib.sha256).hexdigest())' "$TIMESTAMP" "$BODY")
          printf '%s' "$BODY" | curl --fail --silent --show-error --max-time 10 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Steward-Timestamp: $TIMESTAMP" \
            -H "X-Steward-Signature: $SIGNATURE" \
            --data-binary @- \
            "$STEWARD_URL/api/steward/evidence/"

  # ==========================================================================
  # Fleet rollout (workflow_dispatch only) — one-shot eager bump of every
  # active tenant onto the current ACR image / current AGENTS.md template.
  #
  # Previously these steps lived inside `deploy-backend`, but that job's
  # `if: push && main` condition meant the workflow_dispatch event never
  # actually ran the rollout. Past dispatch runs (e.g. 25620166902) show
  # `deploy-backend: skipped` confirming the dead path. Moved here as a
  # standalone job so the dispatcher inputs actually do work.
  #
  # The job depends on nothing — it just calls Django endpoints with the
  # deploy secret. Assumes the latest image is already in ACR (true if a
  # push-to-main has landed since the last bump, which is the only time
  # you'd want to run this anyway).
  # ==========================================================================
  fleet-rollout:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (inputs.rollout_byo_image_bump == 'true' || inputs.rollout_byo_persona_refresh == 'true')
    steps:
      - name: One-shot — fleet OpenClaw image bump
        if: inputs.rollout_byo_image_bump == 'true'
        run: |
          # Wraps `bump_all_tenant_images` mgmt command via the Django API.
          # Hits every ACTIVE tenant (hibernated skipped by default — they
          # self-heal at wake time per PR #384).
          DJANGO_URL="https://nbhd-django-westus2.victoriousocean-5cdd2683.westus2.azurecontainerapps.io"
          curl -sf -X POST \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"include_hibernated": false}' \
            "$DJANGO_URL/api/cron/rollout-byo-image-bump/"

      - name: One-shot — fleet AGENTS.md refresh
        if: inputs.rollout_byo_persona_refresh == 'true'
        run: |
          # Re-render workspace/AGENTS.md from the current template + per-
          # tenant persona/extras and push to every tenant's file share.
          DJANGO_URL="https://nbhd-django-westus2.victoriousocean-5cdd2683.westus2.azurecontainerapps.io"
          curl -sf -X POST \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"include_hibernated": false}' \
            "$DJANGO_URL/api/cron/rollout-byo-persona-refresh/"

  # ==========================================================================
  # Deploy Frontend to Azure Static Web App (push to main only)
  # ==========================================================================
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend-test, backend-test, openclaw-config-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # Same superseded-commit backstop as deploy-backend. This job uses a plain
      # (shallow) checkout, so `git fetch origin main` + rev-parse of FETCH_HEAD
      # is what makes the comparison work here — do not switch to origin/main,
      # which needs a refspec this shallow checkout doesn't guarantee.
      - name: Skip if superseded by a newer main commit
        id: freshness
        run: |
          git fetch origin main --quiet
          TIP=$(git rev-parse FETCH_HEAD)
          if [ "$TIP" != "${{ github.sha }}" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping frontend deploy: origin/main is now $TIP, this run is ${{ github.sha }} (superseded). The newer run will deploy — this run ends green."
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
            echo "This run (${{ github.sha }}) is the tip of main — proceeding with deploy."
          fi

      - name: Set up Node.js
        if: steps.freshness.outputs.superseded != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        if: steps.freshness.outputs.superseded != 'true'
        working-directory: frontend
        run: npm ci

      - name: Build frontend (static export)
        if: steps.freshness.outputs.superseded != 'true'
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.hoodunited.org
          NEXT_PUBLIC_APPLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_APPLE_CLIENT_ID }}
          NEXT_PUBLIC_APPLE_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_APPLE_REDIRECT_URI }}
          # Constellation "exploration mode" — ON for all users. Remove this line to gate it dark again.
          NEXT_PUBLIC_CONSTELLATION_PLAY: "1"
        run: npm run build

      - name: Verify staticwebapp.config.json in output
        if: steps.freshness.outputs.superseded != 'true'
        working-directory: frontend
        run: |
          if [ ! -f "out/staticwebapp.config.json" ]; then
            echo "Copying staticwebapp.config.json to out/"
            cp public/staticwebapp.config.json out/
          fi
          echo "staticwebapp.config.json present in out/"

      - name: Verify SWA deployment token
        if: steps.freshness.outputs.superseded != 'true'
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
        run: |
          if [ -z "$SWA_CLI_DEPLOYMENT_TOKEN" ]; then
            echo "Missing SWA_DEPLOYMENT_TOKEN secret"
            exit 1
          fi

      - name: Deploy to Azure Static Web App
        if: steps.freshness.outputs.superseded != 'true'
        working-directory: frontend
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
        run: |
          npx --yes @azure/static-web-apps-cli@2.0.7 deploy out \
            --deployment-token "$SWA_CLI_DEPLOYMENT_TOKEN" \
            --env production \
            --verbose
