<!doctype html><html lang="en"><meta charset="utf-8"><title>Yuki local test signup</title>
<h1>Local test account</h1><p>MJ creates this account. Use a dedicated email and password.</p>
<form id="signup"><label>Email <input name="email" type="email" required autocomplete="username"></label>
<label>Password <input name="password" type="password" required autocomplete="new-password" minlength="8"></label>
<button>Create account</button></form><p id="status" role="status"></p>
<script>
const form = document.querySelector('form');
form.addEventListener('submit', async event => {
  event.preventDefault();
  const fields = new FormData(form);
  const response = await fetch('/api/v1/auth/signup/', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email: fields.get('email'), password: fields.get('password'), display_name: 'Yuki Test'})
  });
  form.reset();
  document.querySelector('#status').textContent = response.status === 201
    ? 'Account created. Run the documented local tenant preparation command next.'
    : 'Signup failed. Check the email and password, then retry.';
});
</script></html>
